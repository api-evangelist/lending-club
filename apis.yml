aid: lending-club
name: LendingClub
description: LendingClub is a US consumer-finance company and digital bank, originally founded in 2006
  as a peer-to-peer marketplace lender and later a national bank holding company after its 2021 acquisition
  of Radius Bancorp. In 2026 the company rebranded as Happen Bank, N.A. (a wholly-owned subsidiary of
  Happen, Inc.) and moved its public web presence from lendingclub.com to happen.com, where it offers
  personal loans, auto refinancing, business loans, LevelUp checking and savings accounts, the DebtIQ
  credit dashboard, and an institutional investing program for marketplace-lending loan buyers. LendingClub
  historically published a public Investor API for its retail notes marketplace; that marketplace was
  retired in December 2020 and the developer portal and API documentation are no longer published. As
  of this enrichment pass the company operates no public developer program, API reference, or SDK
  surface, and no OpenAPI or event specifications are available to harvest.
